[[signature]]
id = "choose-literal-without-witness"
references = ["../conformance/choose-without-witness.md", "../findings/TLC/tlc-007.md"]
description = "TLC rejects CHOOSE over the empty set or with the predicate FALSE when it evaluates it."
match = [
  '(CHOOSE3 _ (SET_ENUM) _)',
  '(CHOOSE3 _ _ FALSE)',
  '(CHOOSE2 _ FALSE)',
]

[[signature]]
id = "choose-literal-several-witnesses"
references = ["../conformance/choose-multiple-witnesses.md"]
description = "TLC and Apalache may pick different witnesses of CHOOSE with the predicate TRUE."
match = ['(CHOOSE3 _ _ TRUE)']

[[signature]]
id = "case-literal-guards"
references = ["../conformance/case-without-matching-arm.md", "../conformance/case-multiple-true-guards.md"]
description = "TLC rejects CASE whose only guard is FALSE, and the tools may pick different arms when two guards are TRUE."
match = [
  '(CASE FALSE _)',
  '(CASE TRUE _ TRUE _ ...)',
]

[[signature]]
id = "tlc-partial-operator-in-filter"
references = ["../findings/TLC/tlc-001.md"]
description = "TLC reports an evaluation error in a set-filter predicate as error 1000."
match = [
  '(SET_FILTER _ _ (.. (FUN_APP ...)))',
  '(SET_FILTER _ _ (.. (CHOOSE3 ...)))',
  '(SET_FILTER _ _ (.. (CASE ...)))',
  '(SET_FILTER _ _ (.. (Variants!VariantGetUnsafe ...)))',
]

[[signature]]
id = "tlc-union-nonenumerable"
references = ["../findings/TLC/tlc-003.md"]
description = "TLC reports UNION of a set with a nonenumerable element as error 1000."
match = [
  '(SET_UNARY_UNION (.. STRING))',
  '(SET_UNARY_UNION (.. (Sequences!Seq _)))',
]

[[signature]]
id = "tlc-partial-operator-under-eventuality"
references = [
  "../findings/TLC/tlc-008.md",
  "../findings/TLC/tlc-009.md",
  "../findings/TLC/tlc-010.md",
]
description = "TLC exits with status 0 or error 1000 on an evaluation error inside <> or ~>."
match = [
  '(& (EVENTUALLY ...) (.. (FUN_APP ...)))',
  '(& (EVENTUALLY ...) (.. (CHOOSE3 ...)))',
  '(& (EVENTUALLY ...) (.. (CHOOSE2 ...)))',
  '(& (EVENTUALLY ...) (.. (CASE ...)))',
  '(& (EVENTUALLY ...) (.. (CASE_OTHER ...)))',
  '(& (EVENTUALLY ...) (.. (Sequences!Head ...)))',
  '(& (EVENTUALLY ...) (.. (Sequences!Tail ...)))',
  '(& (EVENTUALLY ...) (.. (Sequences!SubSeq ...)))',
  '(& (EVENTUALLY ...) (.. (DIV ...)))',
  '(& (EVENTUALLY ...) (.. (MOD ...)))',
  '(& (EVENTUALLY ...) (.. (POW ...)))',
  '(& (EVENTUALLY ...) (.. (FiniteSets!Cardinality ...)))',
  '(& (EVENTUALLY ...) (.. (Variants!VariantGetUnsafe ...)))',
  '(& (LEADS_TO ...) (.. (FUN_APP ...)))',
  '(& (LEADS_TO ...) (.. (CHOOSE3 ...)))',
  '(& (LEADS_TO ...) (.. (CHOOSE2 ...)))',
  '(& (LEADS_TO ...) (.. (CASE ...)))',
  '(& (LEADS_TO ...) (.. (CASE_OTHER ...)))',
  '(& (LEADS_TO ...) (.. (Sequences!Head ...)))',
  '(& (LEADS_TO ...) (.. (Sequences!Tail ...)))',
  '(& (LEADS_TO ...) (.. (Sequences!SubSeq ...)))',
  '(& (LEADS_TO ...) (.. (DIV ...)))',
  '(& (LEADS_TO ...) (.. (MOD ...)))',
  '(& (LEADS_TO ...) (.. (POW ...)))',
  '(& (LEADS_TO ...) (.. (FiniteSets!Cardinality ...)))',
  '(& (LEADS_TO ...) (.. (Variants!VariantGetUnsafe ...)))',
]

[[signature]]
id = "temporal-under-bounded-quantifier"
references = [
  "../conformance/tlc-temporal-formula-limits.md",
  "../findings/TLC/tlc-011.md",
  "../findings/apalache-temporal/apalache-temporal-003.md",
]
description = "TLC cannot handle a temporal formula under a bounded quantifier whose domain fails, and Apalache leaves the bound variable unassigned."
match = [
  '(& (EXISTS3 ...) (.. (GLOBALLY ...)))',
  '(& (EXISTS3 ...) (.. (EVENTUALLY ...)))',
  '(& (EXISTS3 ...) (.. (LEADS_TO ...)))',
  '(& (EXISTS3 ...) (.. (GUARANTEES ...)))',
  '(& (EXISTS3 ...) (.. (WEAK_FAIRNESS ...)))',
  '(& (EXISTS3 ...) (.. (STRONG_FAIRNESS ...)))',
