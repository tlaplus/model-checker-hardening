  '(& (EXISTS3 ...) (.. (TEMPORAL_FORALL ...)))',
  '(& (FORALL3 ...) (.. (GLOBALLY ...)))',
  '(& (FORALL3 ...) (.. (EVENTUALLY ...)))',
  '(& (FORALL3 ...) (.. (LEADS_TO ...)))',
  '(& (FORALL3 ...) (.. (GUARANTEES ...)))',
  '(& (FORALL3 ...) (.. (WEAK_FAIRNESS ...)))',
  '(& (FORALL3 ...) (.. (STRONG_FAIRNESS ...)))',
  '(& (FORALL3 ...) (.. (TEMPORAL_EXISTS ...)))',
  '(& (FORALL3 ...) (.. (TEMPORAL_FORALL ...)))',
]

[[signature]]
id = "temporal-under-if"
references = ["../conformance/tlc-temporal-formula-limits.md"]
description = "TLC cannot handle some temporal formulas in an IF branch or under a negated constant IF."
