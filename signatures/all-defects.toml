[[signature]]
id = "printer-nested-case-arm"
references = ["../findings/apalache-printer/apalache-printer-009.md"]
description = "PrettyWriter lets a CASE nested in a non-last arm absorb the enclosing CASE's later arms."
match = [
  '(CASE _ (.. (CASE ...)) _ ...)',
  '(CASE_OTHER _ _ (.. (CASE ...)) ...)',
  '(CASE _ _ _ (.. (CASE ...)) _ ...)',
  '(CASE_OTHER _ _ _ _ (.. (CASE ...)) ...)',
  '(CASE _ _ _ _ _ (.. (CASE ...)) _ ...)',
  '(CASE_OTHER _ _ _ _ _ _ (.. (CASE ...)) ...)',
  '(CASE _ _ _ _ _ _ _ (.. (CASE ...)) _ ...)',
  '(CASE_OTHER _ _ _ _ _ _ _ _ (.. (CASE ...)) ...)',
  '(CASE _ (.. (CASE_OTHER ...)) _ ...)',
  '(CASE_OTHER _ _ (.. (CASE_OTHER ...)) ...)',
  '(CASE _ _ _ (.. (CASE_OTHER ...)) _ ...)',
  '(CASE_OTHER _ _ _ _ (.. (CASE_OTHER ...)) ...)',
  '(CASE _ _ _ _ _ (.. (CASE_OTHER ...)) _ ...)',
  '(CASE_OTHER _ _ _ _ _ _ (.. (CASE_OTHER ...)) ...)',
  '(CASE _ _ _ _ _ _ _ (.. (CASE_OTHER ...)) _ ...)',
  '(CASE_OTHER _ _ _ _ _ _ _ _ (.. (CASE_OTHER ...)) ...)',
]

[[signature]]
id = "printer-set-map-connective-body"
references = ["../findings/apalache-printer/apalache-printer-010.md"]
description = "PrettyWriter does not delimit a set-map body wrapped in a one-argument conjunction or disjunction."
match = [
  '(SET_MAP (AND (.. (SET_IN ...))) ...)',
  '(SET_MAP (AND (.. (SET_NOT_IN ...))) ...)',
  '(SET_MAP (OR (.. (SET_IN ...))) ...)',
  '(SET_MAP (OR (.. (SET_NOT_IN ...))) ...)',
]

