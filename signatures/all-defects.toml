# Recall-first known-defect signatures.
#
# This database is a superset of known-defects.toml: its first signatures are those of
# known-defects.toml, in the same order and with the same ids, descriptions and patterns. List it
# in a corpus's [workflow.inputs] known_defects *instead of* known-defects.toml, not next to it,
# because an id may be defined only once across the listed databases.
#
# The goal is a fast corpus: quarantine every candidate that could trigger a defect recorded in
# ../findings or ../conformance, and spend checking time only on candidates that can show new
# behavior. Where a defect depends on run-time values, a signature matches the operator when it
# is uncommon in generated code (Int, Nat, SUBSET, .., ^, \div, ENABLED, WF, SF), and only literal
# or special shapes when the operator is frequent or useful ([S -> T], f[x], CHOOSE, CASE, Head,
# Tail, SubSeq, %). The
# signatures after the shipped ones are not measured for precision.
# docs/manual/known-defect-signatures.md describes the format and this database.
#
# Documents without a signature, because no pattern can express them:
# - constant-false-invariant, constant-property-tlc-rejects: a pattern cannot be anchored to Inv
#   or Prop, and FALSE alone would match nearly every candidate.
# - label-inside-except, sany-002, labeled rows of tlc-temporal-formula-limits: labels are skipped.
# - Values known only at run time: arithmetic overflow (integer-outside-tlc-range beyond the
#   literals), partial operators beyond the literal shapes, apalache-cli-001's non-existing variant
#   option and z3 UNKNOWN, tlc-007's pair of errors, apalache-builder-001's deep nesting.
# - Frequent operators whose defect depends on the operand values: order-sensitive-set-fold (the
#   combinator's order sensitivity) and tlc-004 (a CHOOSE over a set of 10^5 functions; the large
#   sets it needs are caught by powerset, function-set-expansion and integer-range).
# - tlc-performance-001: stack exhaustion depends on the run-time sequence length and JVM stack
#   size, which cannot be expressed by a structural signature.
# - vacuous-initial-predicate: both tools pass.
# - apalache-printer-001 to 007, apalache-json-001 and 002: fixed.
# - apalache-json-003: occurs in library preparation, not in generated inputs; library JSON is
#   pruned and the affected operators are not selected.
# - apalache-typechecker-001: occurs when a custom-operator library is typechecked, not in
#   generated inputs, whose definitions carry @type annotations; the recursion library annotates
#   the affected operators.
#
# References are relative to this file.

[[signature]]
id = "modulo-by-literal-zero"
references = ["../conformance/modulo-by-zero-apalache-fails.md", "../findings/TLC/tlc-002.md"]
description = "Apalache preprocessing reports Mod by zero for a literal-zero modulus, even in a branch TLC never evaluates."
match = ['(MOD _ 0)']

[[signature]]
id = "division-by-literal-zero"
references = ["../conformance/division-by-zero-apalache-fails.md", "../conformance/division-by-zero-tlc-fails.md", "../findings/TLC/tlc-002.md"]
description = "Apalache preprocessing reports Division by zero for a literal-zero divisor, even in a branch TLC never evaluates."
match = ['(DIV _ 0)']

[[signature]]
id = "zero-power-zero"
references = ["../conformance/zero-power-zero-apalache-fails.md", "../conformance/zero-power-zero-tlc-fails.md", "../findings/TLC/tlc-002.md"]
description = "Apalache preprocessing reports 0 ^ 0 as undefined, even in a branch TLC never evaluates."
match = ['(POW 0 0)']

[[signature]]
id = "integer-literal-outside-tlc-range"
references = ["../conformance/integer-outside-tlc-range.md"]
description = "TLC rejects an integer literal outside the signed 32-bit range; these are the out-of-range boundary literals."
match = ['2147483648', '-2147483649', '9223372036854775807']

[[signature]]
id = "sequence-set"
references = ["../conformance/sequence-set-unsupported.md", "../findings/TLC/tlc-003.md"]
description = "Apalache reports Seq(S) as unsupported when it reaches it."
match = ['(Sequences!Seq _)']

[[signature]]
id = "string-set"
references = ["../conformance/string-set-unsupported.md", "../conformance/string-set-tlc-fails.md", "../findings/TLC/tlc-003.md"]
description = "Apalache reports the predefined set STRING as unsupported when it reaches it."
match = ['STRING']

[[signature]]
id = "tlc-temporal-equivalence"
references = ["../conformance/tlc-temporal-formula-limits.md"]
description = "TLC reports that it cannot handle a temporal formula under <=> (tlaplus/tlaplus#1029)."
match = [
  '(& (EQUIV ...) (.. (GLOBALLY ...)))',
  '(& (EQUIV ...) (.. (EVENTUALLY ...)))',
  '(& (EQUIV ...) (.. (LEADS_TO ...)))',
  '(& (EQUIV ...) (.. (GUARANTEES ...)))',
  '(& (EQUIV ...) (.. (WEAK_FAIRNESS ...)))',
  '(& (EQUIV ...) (.. (STRONG_FAIRNESS ...)))',
  '(& (EQUIV ...) (.. (TEMPORAL_EXISTS ...)))',
  '(& (EQUIV ...) (.. (TEMPORAL_FORALL ...)))',
]

[[signature]]
id = "tlc-temporal-case"
references = ["../conformance/tlc-temporal-formula-limits.md"]
description = "TLC reports that it cannot handle a temporal formula in a CASE arm."
match = [
  '(& (CASE ...) (.. (GLOBALLY ...)))',
  '(& (CASE ...) (.. (EVENTUALLY ...)))',
  '(& (CASE ...) (.. (LEADS_TO ...)))',
  '(& (CASE ...) (.. (GUARANTEES ...)))',
  '(& (CASE ...) (.. (WEAK_FAIRNESS ...)))',
  '(& (CASE ...) (.. (STRONG_FAIRNESS ...)))',
  '(& (CASE ...) (.. (TEMPORAL_EXISTS ...)))',
  '(& (CASE ...) (.. (TEMPORAL_FORALL ...)))',
  '(& (CASE_OTHER ...) (.. (GLOBALLY ...)))',
  '(& (CASE_OTHER ...) (.. (EVENTUALLY ...)))',
  '(& (CASE_OTHER ...) (.. (LEADS_TO ...)))',
  '(& (CASE_OTHER ...) (.. (GUARANTEES ...)))',
  '(& (CASE_OTHER ...) (.. (WEAK_FAIRNESS ...)))',
  '(& (CASE_OTHER ...) (.. (STRONG_FAIRNESS ...)))',
  '(& (CASE_OTHER ...) (.. (TEMPORAL_EXISTS ...)))',
  '(& (CASE_OTHER ...) (.. (TEMPORAL_FORALL ...)))',
]

[[signature]]
id = "tlc-temporal-unbounded-quantifier"
references = ["../conformance/tlc-temporal-formula-limits.md"]
description = "TLC reports that it cannot handle a temporal formula under an unbounded quantifier."
match = [
  '(& (FORALL2 ...) (.. (GLOBALLY ...)))',
  '(& (FORALL2 ...) (.. (EVENTUALLY ...)))',
  '(& (FORALL2 ...) (.. (LEADS_TO ...)))',
  '(& (FORALL2 ...) (.. (GUARANTEES ...)))',
  '(& (FORALL2 ...) (.. (WEAK_FAIRNESS ...)))',
  '(& (FORALL2 ...) (.. (STRONG_FAIRNESS ...)))',
  '(& (FORALL2 ...) (.. (TEMPORAL_EXISTS ...)))',
  '(& (FORALL2 ...) (.. (TEMPORAL_FORALL ...)))',
  '(& (EXISTS2 ...) (.. (GLOBALLY ...)))',
  '(& (EXISTS2 ...) (.. (EVENTUALLY ...)))',
  '(& (EXISTS2 ...) (.. (LEADS_TO ...)))',
  '(& (EXISTS2 ...) (.. (GUARANTEES ...)))',
  '(& (EXISTS2 ...) (.. (WEAK_FAIRNESS ...)))',
  '(& (EXISTS2 ...) (.. (STRONG_FAIRNESS ...)))',
  '(& (EXISTS2 ...) (.. (TEMPORAL_EXISTS ...)))',
  '(& (EXISTS2 ...) (.. (TEMPORAL_FORALL ...)))',
]

[[signature]]
id = "tlc-eventually-action"
references = ["../conformance/tlc-temporal-formula-limits.md"]
description = "TLC rejects <><<A>>_v, accepting actions in temporal formulas only as <>[]A or []<>A; also matches []<><<A>>_v, which TLC checks."
match = [
  '(EVENTUALLY (NO_STUTTER ...))',
]

[[signature]]
id = "tlc-always-action-under-temporal"
references = ["../conformance/tlc-temporal-formula-limits.md"]
description = "TLC rejects [][A]_v under <>, ~> or [], accepting actions in temporal formulas only as <>[]A or []<>A."
match = [
  '(& (EVENTUALLY ...) (.. (GLOBALLY (STUTTER ...))))',
  '(& (LEADS_TO ...) (.. (GLOBALLY (STUTTER ...))))',
  '(GLOBALLY (.. (GLOBALLY (STUTTER ...))))',
]

[[signature]]
id = "tlc-fairness-under-eventuality"
references = ["../conformance/tlc-temporal-formula-limits.md"]
description = "TLC rejects WF or SF under <> or ~>, accepting actions in temporal formulas only as <>[]A or []<>A."
match = [
  '(& (EVENTUALLY ...) (.. (WEAK_FAIRNESS ...)))',
  '(& (EVENTUALLY ...) (.. (STRONG_FAIRNESS ...)))',
  '(& (LEADS_TO ...) (.. (WEAK_FAIRNESS ...)))',
  '(& (LEADS_TO ...) (.. (STRONG_FAIRNESS ...)))',
]

[[signature]]
id = "tlc-always-action-under-connective"
references = ["../conformance/tlc-temporal-formula-limits.md"]
description = "TLC rejects [][A]_v under ~, => or \\/, accepting actions in temporal formulas only as <>[]A or []<>A; also matches <>[][A]_v there, which TLC checks."
match = [
  '(& (NOT ...) (.. (GLOBALLY (STUTTER ...))))',
  '(& (IMPLIES ...) (.. (GLOBALLY (STUTTER ...))))',
  '(& (OR ...) (.. (GLOBALLY (STUTTER ...))))',
]

