  '(& (STRONG_FAIRNESS ...) (.. (NOT (NOT (.. (WEAK_FAIRNESS ...))))))',
  '(& (STRONG_FAIRNESS ...) (.. (NOT (NOT (.. (STRONG_FAIRNESS ...))))))',
  '(& (STRONG_FAIRNESS ...) (.. (NOT (NOT (.. (TEMPORAL_EXISTS ...))))))',
  '(& (STRONG_FAIRNESS ...) (.. (NOT (NOT (.. (TEMPORAL_FORALL ...))))))',
  '(& (TEMPORAL_EXISTS ...) (.. (NOT (NOT (.. (GLOBALLY ...))))))',
  '(& (TEMPORAL_EXISTS ...) (.. (NOT (NOT (.. (EVENTUALLY ...))))))',
  '(& (TEMPORAL_EXISTS ...) (.. (NOT (NOT (.. (LEADS_TO ...))))))',
  '(& (TEMPORAL_EXISTS ...) (.. (NOT (NOT (.. (GUARANTEES ...))))))',
  '(& (TEMPORAL_EXISTS ...) (.. (NOT (NOT (.. (WEAK_FAIRNESS ...))))))',
  '(& (TEMPORAL_EXISTS ...) (.. (NOT (NOT (.. (STRONG_FAIRNESS ...))))))',
  '(& (TEMPORAL_EXISTS ...) (.. (NOT (NOT (.. (TEMPORAL_EXISTS ...))))))',
  '(& (TEMPORAL_EXISTS ...) (.. (NOT (NOT (.. (TEMPORAL_FORALL ...))))))',
  '(& (TEMPORAL_FORALL ...) (.. (NOT (NOT (.. (GLOBALLY ...))))))',
  '(& (TEMPORAL_FORALL ...) (.. (NOT (NOT (.. (EVENTUALLY ...))))))',
  '(& (TEMPORAL_FORALL ...) (.. (NOT (NOT (.. (LEADS_TO ...))))))',
  '(& (TEMPORAL_FORALL ...) (.. (NOT (NOT (.. (GUARANTEES ...))))))',
  '(& (TEMPORAL_FORALL ...) (.. (NOT (NOT (.. (WEAK_FAIRNESS ...))))))',
  '(& (TEMPORAL_FORALL ...) (.. (NOT (NOT (.. (STRONG_FAIRNESS ...))))))',
  '(& (TEMPORAL_FORALL ...) (.. (NOT (NOT (.. (TEMPORAL_EXISTS ...))))))',
  '(& (TEMPORAL_FORALL ...) (.. (NOT (NOT (.. (TEMPORAL_FORALL ...))))))',
]

[[signature]]
id = "tlc-multiplication-in-fold-under-eventuality"
references = ["../findings/TLC/tlc-015.md"]
description = "TLC evaluates a fold whose combinator multiplies, under <> or ~>, as constant-level and reports a state variable as undefined."
match = [
  '(& (EVENTUALLY ...) (.. (Apalache!ApaFoldSet (.. (MULT ...)) ...)))',
  '(& (EVENTUALLY ...) (.. (Apalache!ApaFoldSeqLeft (.. (MULT ...)) ...)))',
  '(& (LEADS_TO ...) (.. (Apalache!ApaFoldSet (.. (MULT ...)) ...)))',
  '(& (LEADS_TO ...) (.. (Apalache!ApaFoldSeqLeft (.. (MULT ...)) ...)))',
]

# Community Modules operators. A generated module calls a library operator through an alias
# named Custom<hex(module)>N<hex(operator)> (OperatorLibrary), which the IR applies with OPER_APP.
# Each defect below depends on run-time argument values, and the operators are uncommon, so the
# signatures match every application.

[[signature]]
id = "community-is-injective"
references = ["../findings/TLC/tlc-016.md"]
description = "TLC's IsInjective override rejects a record or an unevaluated function constructor as not a function."
match = ['(OPER_APP Custom46756e6374696f6e73N4973496e6a656374697665 _)']

[[signature]]
id = "community-anti-function"
references = ["../findings/TLC/tlc-017.md"]
description = "TLC's AntiFunction override fails on a function that is not injective."
match = ['(OPER_APP Custom46756e6374696f6e73N416e746946756e6374696f6e _)']

[[signature]]
id = "community-index-first-subseq"
references = ["../findings/apalache-rewiring/apalache-rewiring-001.md"]
description = "Apalache's IndexFirstSubSeq returns 0 for the empty needle, where the Community Modules definition returns 1."
match = ['(OPER_APP Custom53657175656e636573457874N496e6465784669727374537562536571 _ _)']

[[signature]]
id = "community-longest-common-prefix"
references = [
  "../findings/apalache-performance/apalache-performance-001.md",
  "../conformance/choose-without-witness.md",
  "../findings/TLC/tlc-002.md",
]
description = "Apalache can exhaust its heap on LongestCommonPrefix of a computed set, and TLC rejects LongestCommonPrefix({})."
match = ['(OPER_APP Custom53657175656e636573457874N4c6f6e67657374436f6d6d6f6e507265666978 _)']

[[signature]]
id = "community-bag-fold"
references = ["../conformance/bag-nonpositive-multiplicity.md", "../findings/TLC/tlc-002.md"]
description = "TLC rejects SumBag and ProductBag of a function with a non-positive multiplicity, which Apalache evaluates."
match = [
  '(OPER_APP Custom42616773457874N53756d426167 _)',
  '(OPER_APP Custom42616773457874N50726f64756374426167 _)',
]

[[signature]]
id = "community-exists-surjection"
references = ["../findings/apalache-rewiring/apalache-rewiring-002.md"]
description = "Apalache's ExistsSurjection(S, T) is TRUE for a non-empty S and an empty T, where no surjection exists."
match = ['(OPER_APP Custom46756e6374696f6e73N4578697374735375726a656374696f6e _ _)']

# VariantFilter is a generated set form, not a library operator. Its defect depends on run-time
# payload values and on the other tags in the set, so the signature matches every application.

[[signature]]
id = "variant-filter"
references = ["../findings/apalache-bmc/apalache-bmc-022.md"]
description = "Apalache's VariantFilter makes the constraints unsatisfiable when a selected payload shares its cell with the default payload of another tag, such as FALSE or 0."
match = ['(Variants!VariantFilter _ _)']

# A set map counts the elements of a bound set before duplicates are removed. A set computed by a
# map with two or more bound variables therefore counts one element per tuple, and a fold that
# maps its accumulator multiplies the count at every step. The guard fires at run-time sizes, so
# the signature matches the shapes that compound the count.

[[signature]]
id = "set-map-duplicate-product"
references = ["../conformance/set-map-product-guard.md"]
description = "Apalache refuses a set map whose bound sets count more than 1,000,000 tuples, counting a mapped set by its tuples rather than its distinct values."
match = [
  '(Apalache!ApaFoldSet (.. (SET_MAP _ _ _ _ _ ...)) _ _)',
  '(Apalache!ApaFoldSeqLeft (.. (SET_MAP _ _ _ _ _ ...)) _ _)',
  '(SET_MAP _ _ (.. (SET_MAP _ _ _ _ _ ...)) _ _ ...)',
  '(SET_MAP _ _ _ _ (.. (SET_MAP _ _ _ _ _ ...)) ...)',
]

[[signature]]
id = "recursion-insertion-sort"
references = ["../findings/apalache-performance/apalache-performance-002.md"]
description = "Apalache can exhaust its heap on the recursion library's insertion sort, which nests ApaFoldSeqLeft, from about nine elements or when a sorted result is sorted again."
match = [
  '(OPER_APP Custom526563757273696f6e4170616c61636865N536571496e73657274696f6e536f7274 _)',
  '(OPER_APP Custom526563757273696f6e4170616c61636865N536574546f536f72746564536571 _)',
]
