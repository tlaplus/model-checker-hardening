[[signature]]
id = "sany-temporal-under-modulo"
references = ["../findings/SANY/sany-001.md"]
description = "SANY crashes while formatting the level error for % applied to a temporal formula."
match = [
  '(& (MOD ...) (.. (GLOBALLY ...)))',
  '(& (MOD ...) (.. (EVENTUALLY ...)))',
  '(& (MOD ...) (.. (LEADS_TO ...)))',
  '(& (MOD ...) (.. (GUARANTEES ...)))',
  '(& (MOD ...) (.. (WEAK_FAIRNESS ...)))',
