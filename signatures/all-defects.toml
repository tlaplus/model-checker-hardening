[[signature]]
id = "apalache-nested-leads-to"
references = ["../findings/apalache-temporal/apalache-temporal-001.md"]
description = "Apalache fails TemporalPass with an empty diagnostic on ~> nested in ~>."
match = [
  '(LEADS_TO (.. (LEADS_TO _ _)) _)',
  '(LEADS_TO _ (.. (LEADS_TO _ _)))',
]

[[signature]]
id = "apalache-leads-to-two-binder-function"
references = ["../findings/apalache-temporal/apalache-temporal-004.md"]
description = "Apalache's renamer crashes on a function constructor with two bound variables under ~>."
match = [
  '(LEADS_TO (.. (FUN_CTOR _ _ _ _ _ ...)) _)',
  '(LEADS_TO _ (.. (FUN_CTOR _ _ _ _ _ ...)))',
]

[[signature]]
id = "apalache-nested-one-conjunct"
references = ["../findings/apalache-temporal/apalache-temporal-002.md"]
description = "Apalache fails type checking under --temporal on a nested one-conjunct list in a fold lambda."
match = ['(AND (AND _))']

[[signature]]
id = "apalache-always-action-bound"
references = ["../findings/apalache-temporal/apalache-temporal-005.md"]
description = "Apalache needs one more step than the lasso to report a [][A]_v violation under a Boolean connective, such as the workflow's Fairness => Prop."
match = ['(GLOBALLY (STUTTER ...))']

[[signature]]
id = "apalache-fold-singleton-membership"
references = ["../findings/apalache-bmc/apalache-bmc-013.md"]
description = "Apalache crashes in SetInRule when a fold combinator tests membership in a singleton set literal."
match = [
  '(Apalache!ApaFoldSet (.. (SET_IN _ (SET_ENUM _))) _ _)',
  '(Apalache!ApaFoldSet (.. (SET_NOT_IN _ (SET_ENUM _))) _ _)',
  '(Apalache!ApaFoldSeqLeft (.. (SET_IN _ (SET_ENUM _))) _ _)',
  '(Apalache!ApaFoldSeqLeft (.. (SET_NOT_IN _ (SET_ENUM _))) _ _)',
]

[[signature]]
id = "apalache-unchanged-after-assignment"
references = ["../findings/apalache-assignments/apalache-assignments-001.md"]
description = "Apalache rejects UNCHANGED, [A]_v or <<A>>_v used as a guard after the variable is assigned."
match = [
  '(& (AND ...) (.. (PRIME _)) (.. (NOT (.. (UNCHANGED _)))))',
  '(IF_THEN_ELSE (.. (UNCHANGED _)) _ _)',
  '(CASE (.. (UNCHANGED _)) ...)',
  '(& (AND ...) (.. (PRIME _)) (.. (NO_STUTTER ...)))',
]

