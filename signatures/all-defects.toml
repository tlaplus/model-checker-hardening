[[signature]]
id = "powerset"
references = [
  "../conformance/choose-symbolic-set-element.md",
  "../conformance/symbolic-set-equality.md",
  "../conformance/set-filter-symbolic-set.md",
  "../conformance/infinite-set-as-membership-element.md",
  "../findings/apalache-bmc/apalache-bmc-001.md",
  "../findings/apalache-bmc/apalache-bmc-003.md",
  "../findings/apalache-bmc/apalache-bmc-006.md",
  "../findings/apalache-bmc/apalache-bmc-010.md",
  "../findings/apalache-bmc/apalache-bmc-014.md",
  "../findings/apalache-bmc/apalache-bmc-020.md",
  "../findings/apalache-optimizer/apalache-optimizer-001.md",
  "../findings/TLC/tlc-004.md",
]
description = "Apalache crashes on SUBSET S in set filters, set maps, equality, UNION and CHOOSE, and silently evaluates a SUBSET-valued fold combinator to the empty set; these reach it through names this pattern cannot follow."
match = ['(SET_POWERSET _)']

[[signature]]
id = "function-set-empty-component"
references = [
  "../conformance/empty-function-set.md",
  "../findings/apalache-bmc/apalache-bmc-002.md",
  "../findings/apalache-bmc/apalache-bmc-017.md",
  "../findings/apalache-bmc/apalache-bmc-018.md",
]
description = "Apalache violates reflexive equality on [{} -> T], loses the initial states of [D -> {}] for a computed empty D, and crashes on a co-domain computed by a fold."
match = [
  '(FUN_SET (SET_ENUM) _)',
  '(FUN_SET _ (SET_ENUM))',
  '(FUN_SET _ (Apalache!ApaFoldSet ...))',
  '(FUN_SET _ (Apalache!ApaFoldSeqLeft ...))',
]

[[signature]]
id = "function-set-equality"
references = ["../findings/apalache-bmc/apalache-bmc-003.md", "../findings/apalache-bmc/apalache-bmc-011.md"]
description = "Apalache's bounded checker fails on an equality test whose operand is a symbolic function set."
match = [
  '(EQ (FUN_SET _ _) _)',
  '(EQ (IF_THEN_ELSE _ (FUN_SET _ _) _) _)',
  '(EQ (IF_THEN_ELSE _ _ (FUN_SET _ _)) _)',
  '(EQ (SET_UNION2 (FUN_SET _ _) _) _)',
  '(EQ (SET_UNION2 _ (FUN_SET _ _)) _)',
  '(EQ (SET_INTERSECT (FUN_SET _ _) _) _)',
  '(EQ (SET_INTERSECT _ (FUN_SET _ _)) _)',
  '(EQ (SET_MINUS (FUN_SET _ _) _) _)',
  '(NE (FUN_SET _ _) _)',
  '(NE (IF_THEN_ELSE _ (FUN_SET _ _) _) _)',
  '(NE (IF_THEN_ELSE _ _ (FUN_SET _ _)) _)',
  '(NE (SET_UNION2 (FUN_SET _ _) _) _)',
  '(NE (SET_UNION2 _ (FUN_SET _ _)) _)',
  '(NE (SET_INTERSECT (FUN_SET _ _) _) _)',
  '(NE (SET_INTERSECT _ (FUN_SET _ _)) _)',
  '(NE (SET_MINUS (FUN_SET _ _) _) _)',
  '(EQ _ (FUN_SET _ _))',
  '(EQ _ (IF_THEN_ELSE _ (FUN_SET _ _) _))',
  '(EQ _ (IF_THEN_ELSE _ _ (FUN_SET _ _)))',
  '(EQ _ (SET_UNION2 (FUN_SET _ _) _))',
  '(EQ _ (SET_UNION2 _ (FUN_SET _ _)))',
  '(EQ _ (SET_INTERSECT (FUN_SET _ _) _))',
  '(EQ _ (SET_INTERSECT _ (FUN_SET _ _)))',
  '(EQ _ (SET_MINUS (FUN_SET _ _) _))',
  '(NE _ (FUN_SET _ _))',
  '(NE _ (IF_THEN_ELSE _ (FUN_SET _ _) _))',
  '(NE _ (IF_THEN_ELSE _ _ (FUN_SET _ _)))',
  '(NE _ (SET_UNION2 (FUN_SET _ _) _))',
  '(NE _ (SET_UNION2 _ (FUN_SET _ _)))',
  '(NE _ (SET_INTERSECT (FUN_SET _ _) _))',
  '(NE _ (SET_INTERSECT _ (FUN_SET _ _)))',
  '(NE _ (SET_MINUS (FUN_SET _ _) _))',
  '(EXCEPT _ (TUPLE (FUN_SET _ _)) ...)',
]

[[signature]]
id = "function-set-expansion"
references = [
  "../conformance/function-set-expansion-guard.md",
  "../conformance/set-filter-symbolic-set.md",
  "../findings/apalache-bmc/apalache-bmc-001.md",
  "../findings/apalache-cli/apalache-cli-001.md",
  "../findings/TLC/tlc-004.md",
]
description = "Apalache refuses to expand, or cannot filter, a function set that is folded, mapped, filtered, counted, unioned, or in a union that bounds a quantifier or is a set element; TLC can exhaust the heap applying a CHOOSE from one."
match = [
  '(Apalache!ApaFoldSet _ _ (FUN_SET _ _))',
  '(SET_MAP _ _ (FUN_SET _ _) ...)',
  '(SET_FILTER _ (FUN_SET _ _) _)',
  '(FiniteSets!Cardinality (FUN_SET _ _))',
  '(SET_UNARY_UNION (SET_ENUM (FUN_SET _ _) ...))',
  '(FUN_APP (CHOOSE3 _ (FUN_SET _ _) _) _)',
  '(Apalache!ApaFoldSet _ _ (IF_THEN_ELSE _ (FUN_SET _ _) _))',
  '(SET_MAP _ _ (IF_THEN_ELSE _ (FUN_SET _ _) _) ...)',
  '(SET_FILTER _ (IF_THEN_ELSE _ (FUN_SET _ _) _) _)',
  '(FiniteSets!Cardinality (IF_THEN_ELSE _ (FUN_SET _ _) _))',
  '(SET_UNARY_UNION (SET_ENUM (IF_THEN_ELSE _ (FUN_SET _ _) _) ...))',
  '(FUN_APP (CHOOSE3 _ (IF_THEN_ELSE _ (FUN_SET _ _) _) _) _)',
  '(Apalache!ApaFoldSet _ _ (IF_THEN_ELSE _ _ (FUN_SET _ _)))',
  '(SET_MAP _ _ (IF_THEN_ELSE _ _ (FUN_SET _ _)) ...)',
  '(SET_FILTER _ (IF_THEN_ELSE _ _ (FUN_SET _ _)) _)',
  '(FiniteSets!Cardinality (IF_THEN_ELSE _ _ (FUN_SET _ _)))',
  '(SET_UNARY_UNION (SET_ENUM (IF_THEN_ELSE _ _ (FUN_SET _ _)) ...))',
  '(FUN_APP (CHOOSE3 _ (IF_THEN_ELSE _ _ (FUN_SET _ _)) _) _)',
  '(Apalache!ApaFoldSet _ _ (SET_UNION2 (FUN_SET _ _) _))',
  '(SET_MAP _ _ (SET_UNION2 (FUN_SET _ _) _) ...)',
  '(SET_FILTER _ (SET_UNION2 (FUN_SET _ _) _) _)',
  '(FiniteSets!Cardinality (SET_UNION2 (FUN_SET _ _) _))',
  '(SET_UNARY_UNION (SET_ENUM (SET_UNION2 (FUN_SET _ _) _) ...))',
  '(FUN_APP (CHOOSE3 _ (SET_UNION2 (FUN_SET _ _) _) _) _)',
  '(Apalache!ApaFoldSet _ _ (SET_UNION2 _ (FUN_SET _ _)))',
  '(SET_MAP _ _ (SET_UNION2 _ (FUN_SET _ _)) ...)',
  '(SET_FILTER _ (SET_UNION2 _ (FUN_SET _ _)) _)',
  '(FiniteSets!Cardinality (SET_UNION2 _ (FUN_SET _ _)))',
  '(SET_UNARY_UNION (SET_ENUM (SET_UNION2 _ (FUN_SET _ _)) ...))',
  '(FUN_APP (CHOOSE3 _ (SET_UNION2 _ (FUN_SET _ _)) _) _)',
  '(Apalache!ApaFoldSet _ _ (SET_INTERSECT (FUN_SET _ _) _))',
  '(SET_MAP _ _ (SET_INTERSECT (FUN_SET _ _) _) ...)',
  '(SET_FILTER _ (SET_INTERSECT (FUN_SET _ _) _) _)',
  '(FiniteSets!Cardinality (SET_INTERSECT (FUN_SET _ _) _))',
  '(SET_UNARY_UNION (SET_ENUM (SET_INTERSECT (FUN_SET _ _) _) ...))',
  '(FUN_APP (CHOOSE3 _ (SET_INTERSECT (FUN_SET _ _) _) _) _)',
  '(Apalache!ApaFoldSet _ _ (SET_INTERSECT _ (FUN_SET _ _)))',
  '(SET_MAP _ _ (SET_INTERSECT _ (FUN_SET _ _)) ...)',
  '(SET_FILTER _ (SET_INTERSECT _ (FUN_SET _ _)) _)',
  '(FiniteSets!Cardinality (SET_INTERSECT _ (FUN_SET _ _)))',
  '(SET_UNARY_UNION (SET_ENUM (SET_INTERSECT _ (FUN_SET _ _)) ...))',
  '(FUN_APP (CHOOSE3 _ (SET_INTERSECT _ (FUN_SET _ _)) _) _)',
  '(Apalache!ApaFoldSet _ _ (SET_MINUS (FUN_SET _ _) _))',
  '(SET_MAP _ _ (SET_MINUS (FUN_SET _ _) _) ...)',
  '(SET_FILTER _ (SET_MINUS (FUN_SET _ _) _) _)',
  '(FiniteSets!Cardinality (SET_MINUS (FUN_SET _ _) _))',
  '(SET_UNARY_UNION (SET_ENUM (SET_MINUS (FUN_SET _ _) _) ...))',
  '(FUN_APP (CHOOSE3 _ (SET_MINUS (FUN_SET _ _) _) _) _)',
  '(EXISTS3 _ (SET_UNION2 (FUN_SET _ _) _) _)',
  '(EXISTS3 _ (SET_UNION2 _ (FUN_SET _ _)) _)',
  '(SET_ENUM (SET_UNION2 (FUN_SET _ _) _) ...)',
  '(SET_ENUM (SET_UNION2 _ (FUN_SET _ _)) ...)',
  '(SET_FILTER _ (Apalache!ApaFoldSet _ (FUN_SET _ _) _) _)',
