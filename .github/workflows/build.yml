name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - run: mvn --batch-mode --no-transfer-progress verify

  user-manual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: script/requirements-docs.txt
      - run: python3 -m pip install -r script/requirements-docs.txt
      - run: make user-manual

  proofs:
    runs-on: ubuntu-latest
    env:
      TLAPM_RELEASE: 1.6.0-pre
    steps:
      - uses: actions/checkout@v7
      - name: Install TLAPM
        run: |
          curl -fsSL "https://github.com/tlaplus/tlapm/releases/download/$TLAPM_RELEASE/tlapm-$TLAPM_RELEASE-x86_64-linux-gnu.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/tlapm/bin" >> "$GITHUB_PATH"
      - run: make proofs
