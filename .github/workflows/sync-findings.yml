name: Sync findings

on:
  push:
    branches: [main]
    paths:
      - "findings/**"
      - ".github/scripts/**"
      - ".github/workflows/sync-findings.yml"
  pull_request:
    branches: [main]
    paths:
      - "findings/**"
      - ".github/scripts/**"
      - ".github/workflows/sync-findings.yml"
  workflow_dispatch:
    inputs:
      max_creates:
        description: "Most issues one run may create. Raise it only to populate a new repository."
        type: number
        default: 5

concurrency:
  group: sync-findings
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Validate findings
        run: node .github/scripts/sync-findings.cjs
      - name: Test finding synchronization
        run: node --test .github/scripts/sync-findings.test.cjs

  sync:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - name: Synchronize findings
        uses: actions/github-script@v9
        env:
          # Empty outside workflow_dispatch; the script then uses its default.
          FINDING_SYNC_MAX_CREATES: ${{ inputs.max_creates }}
        with:
          retries: 3
          script: |
            const synchronize = require("./.github/scripts/sync-findings.cjs");
            await synchronize({ github, context, core });
