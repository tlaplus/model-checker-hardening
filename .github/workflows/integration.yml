name: Integration tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pbt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Package FuzzTLA
        run: mvn --batch-mode --no-transfer-progress -DskipTests package
      - name: Initialize a 100-entry corpus
        run: |
          ./bin/fuzztla init
          sed -i 's/^max_entries = .*/max_entries = 100/' corpus/config.toml
      - name: Run the PBT workflow
        run: |
          ./bin/fuzztla run --how=pbt
          logical_entries=$(find \
            corpus/00-inputs \
            corpus/01parser-fail \
            corpus/01parser-crash \
            corpus/02apa-inputs \
            -type f -name '*.cbor' | wc -l)
          tlc_results=$(find \
            corpus/02tlc-pass \
            corpus/02tlc-fail \
            corpus/02tlc-crash \
            -type f -name '*.cbor' | wc -l)
          apalache_inputs=$(find corpus/02apa-inputs -type f -name '*.cbor' | wc -l)
          test "$logical_entries" -eq 100
          test "$(find corpus/00-inputs -type f -name '*.cbor' | wc -l)" -eq 0
          test "$(find corpus/01parser-pass -type f -name '*.cbor' | wc -l)" -eq 0
          test "$(find corpus/02tlc-inputs -type f -name '*.cbor' | wc -l)" -eq 0
          test "$tlc_results" -eq "$apalache_inputs"
