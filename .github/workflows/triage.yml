name: Corpus triage

on:
  push:
    branches: [main]
    paths:
      - "script/**"
      - "findings/**"
      - "conformance/**"
      - ".github/workflows/triage.yml"
  pull_request:
    branches: [main]
    paths:
      - "script/**"
      - "findings/**"
      - "conformance/**"
      - ".github/workflows/triage.yml"
  workflow_dispatch:

concurrency:
  group: corpus-triage-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install triager dependencies
        run: python3 -m pip install -r script/requirements.txt
      - name: Test triager
        run: python3 -m unittest discover -s script -p 'test_*.py' -v
      - name: Package FuzzTLA
        run: mvn --batch-mode --no-transfer-progress -DskipTests package
      - name: Initialize a short-run corpus
        run: |
          ./bin/fuzztla init --corpus=triage-corpus
          sed -i \
            -e 's/^kind = "expr"/kind = "module"/' \
            -e 's/^max_entries = .*/max_entries = 100/' \
            -e 's/^workers = .*/workers = 1/' \
            triage-corpus/config.toml
      - name: Run the PBT workflow
        run: ./bin/fuzztla run --how=pbt --corpus=triage-corpus --seed=42 --max-cpus=2
      - name: Classify corpus results
        run: python3 script/triager.py triage-corpus
      - name: Upload triage reports
        uses: actions/upload-artifact@v6
        with:
          name: corpus-triage-${{ github.run_id }}
          path: triage-corpus/*-triage.csv
          if-no-files-found: error
          retention-days: 14
