<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FuzzTLA Architecture Atlas</title>
<style>
  :root {
    --bg: #ffffff; --surface: #f6f8fa; --border: #d0d7de; --text: #1f2328; --muted: #59636e;
    --accent: #0969da; --danger: #cf222e; --edge: #8c959f; --edge-strong: #57606a;
    --package-tint: #0969da; --package-opacity: 0.05; --stub: #eaeef2;
    --role-entry_point: #ffd8b5; --role-facade: #b6e3ff; --role-process: #d8b9ff;
    --role-adapter: #ffc1c0; --role-store: #c6efce; --role-codec: #fff1a8;
    --role-policy: #ffcfe9; --role-model: #d0e8ff; --role-config: #e2d9c4;
    --role-view: #c4f0ea; --role-utility: #e6e6e6; --role-other: #ffffff;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d1117; --surface: #161b22; --border: #30363d; --text: #e6edf3; --muted: #9198a1;
      --accent: #4493f8; --danger: #f85149; --edge: #6e7681; --edge-strong: #9198a1;
      --package-tint: #4493f8; --package-opacity: 0.08; --stub: #21262d;
      --role-entry_point: #6b3d12; --role-facade: #0c4a6e; --role-process: #4c2889;
      --role-adapter: #7a2226; --role-store: #1f5130; --role-codec: #5c4a05;
      --role-policy: #6d1f4c; --role-model: #1d3f66; --role-config: #4a4232;
      --role-view: #134e48; --role-utility: #3a3f46; --role-other: #161b22;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0d1117; --surface: #161b22; --border: #30363d; --text: #e6edf3; --muted: #9198a1;
    --accent: #4493f8; --danger: #f85149; --edge: #6e7681; --edge-strong: #9198a1;
    --package-tint: #4493f8; --package-opacity: 0.08; --stub: #21262d;
    --role-entry_point: #6b3d12; --role-facade: #0c4a6e; --role-process: #4c2889;
    --role-adapter: #7a2226; --role-store: #1f5130; --role-codec: #5c4a05;
    --role-policy: #6d1f4c; --role-model: #1d3f66; --role-config: #4a4232;
    --role-view: #134e48; --role-utility: #3a3f46; --role-other: #161b22;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: grid; grid-template-rows: auto 1fr;
  }
  header {
    display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center;
    padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--surface);
  }
  header h1 { font-size: 16px; margin: 0; white-space: nowrap; }
  #crumbs { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  #crumbs a, #crumbs span { color: var(--accent); text-decoration: none; }
  #crumbs span.current { color: var(--text); font-weight: 600; }
  #crumbs .sep { color: var(--muted); }
  #search {
    flex: 1 1 220px; max-width: 360px; padding: 5px 8px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text); font: inherit;
  }
  #filters { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; color: var(--muted); }
  #filters label { display: inline-flex; gap: 4px; align-items: center; cursor: pointer; }
  #commit { margin-left: auto; color: var(--muted); font-size: 12px; }
  #commit a { color: var(--muted); }
  main { display: grid; grid-template-columns: 1fr 360px; min-height: 0; }
  #graph { min-height: 0; min-width: 0; }
  #panel {
    border-left: 1px solid var(--border); background: var(--surface);
    overflow: auto; padding: 14px 16px; min-height: 0;
  }
  #panel h2 { font-size: 16px; margin: 0 0 4px; word-break: break-word; }
  #panel h3 { font-size: 13px; margin: 16px 0 4px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
  #panel .meta { color: var(--muted); font-size: 12px; }
  #panel ul { margin: 4px 0; padding-left: 18px; }
  #panel li { margin: 2px 0; }
  #panel a { color: var(--accent); text-decoration: none; }
  #panel a:hover { text-decoration: underline; }
  #panel button.link { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font: inherit; text-align: left; }
  #panel button.link:hover { text-decoration: underline; }
  code { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--bg); padding: 0 3px; border-radius: 4px; }
  .swatch { display: inline-block; width: 12px; height: 12px; border: 1px solid var(--border); border-radius: 3px; vertical-align: -2px; margin-right: 6px; }
  .notice { border: 1px solid var(--border); background: var(--bg); padding: 8px 10px; border-radius: 6px; margin: 8px 0; font-size: 13px; }
  .bad { color: var(--danger); font-weight: 600; }
  table.legend { border-collapse: collapse; font-size: 13px; }
  table.legend td { padding: 2px 8px 2px 0; vertical-align: top; }
  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; grid-template-rows: 60vh auto; }
    #panel { border-left: 0; border-top: 1px solid var(--border); }
    #commit { margin-left: 0; }
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/cytoscape@3.30.4/dist/cytoscape.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/elkjs@0.8.2/lib/elk.bundled.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cytoscape-elk@2.2.0/dist/cytoscape-elk.js"></script>
</head>
<body>
<header>
  <h1>FuzzTLA architecture</h1>
  <nav id="crumbs" aria-label="Zoom level"></nav>
  <input id="search" list="names" placeholder="Find a type or module" aria-label="Find a type or module">
  <datalist id="names"></datalist>
  <div id="filters"></div>
  <div id="commit"></div>
</header>
<main>
  <div id="graph" role="img" aria-label="Architecture diagram"></div>
  <aside id="panel"></aside>
</main>
<script id="atlas-data" type="application/json">/*ATLAS_DATA*/</script>
<script>
"use strict";
const DATA = JSON.parse(document.getElementById("atlas-data").textContent);
const MODEL = DATA.model;
const LEGEND = DATA.legend;
const ROOT = DATA.rootPackage;
const LEAF = DATA.leafModule;

// ---- Index ----------------------------------------------------------------
const typesByName = new Map(MODEL.types.map(t => [t.name, t]));
const packagesByName = new Map(MODEL.packages.map(p => [p.name, p]));
const modulesByName = new Map(MODEL.modules.map(m => [m.name, m]));
const decisions = new Map(MODEL.decisions.map(d => [d.number, d]));
const outgoing = new Map(), incoming = new Map();
for (const r of MODEL.relations) {
  (outgoing.get(r.from) || outgoing.set(r.from, []).get(r.from)).push(r);
  (incoming.get(r.to) || incoming.set(r.to, []).get(r.to)).push(r);
}
const moduleOf = t => packagesByName.get(t.packageName).module;
const typesOfPackage = p => MODEL.types.filter(t => t.packageName === p);
const packagesOfModule = m => MODEL.packages.filter(p => p.module === m);
const typesOfModule = m => MODEL.types.filter(t => moduleOf(t) === m);
const plural = (n, word) => n + " " + word + (n === 1 ? "" : "s");
const simpleName = name => name.slice(name.lastIndexOf(".") + 1);
const relativePackage = p => p === ROOT ? "(root)" : p.slice(ROOT.length + 1);
const roleName = r => r ? r.toLowerCase().replace("_", " ") : "other";
const roleVar = r => "--role-" + (r ? r.toLowerCase() : "other");
const kindOrder = LEGEND.relations.map(k => k.name);

// ---- State and routing ----------------------------------------------------
const state = {
  kinds: new Set(LEGEND.relations.filter(k => k.name !== "DEPENDS").map(k => k.name)),
  allTypes: false,
  showLeaf: false,
  showImplied: false,
};

function route() {
  const hash = decodeURIComponent(location.hash.slice(1));
  const [view, ...rest] = hash.split("/");
  const id = rest.join("/");
  if (view === "module" && modulesByName.has(id)) return { view, id };
  if (view === "type" && typesByName.has(id)) return { view, id };
  return { view: "modules", id: null };
}
const go = (view, id) => { location.hash = view === "modules" ? "" : view + "/" + encodeURIComponent(id); };
window.addEventListener("hashchange", render);

// ---- Text helpers -----------------------------------------------------------
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
const prose = s => esc(s || "").replace(/`([^`]+)`/g, "<code>$1</code>");
const blob = path => MODEL.source.repository + "/blob/" + MODEL.source.commit + "/" + path;
const sourceLink = t => blob(t.path) + "#L" + t.line;
function decisionLinks(numbers) {
  return numbers.map(n => {
    const d = decisions.get(n);
    return d ? `<li><a href="${esc(blob(d.path))}" target="_blank" rel="noopener">ADR ${n}: ${esc(d.title)}</a></li>`
             : `<li>ADR ${n}</li>`;
  }).join("");
}
const typeButton = name => `<button class="link" data-type="${esc(name)}">${esc(simpleName(name))}</button>`;
const moduleButton = name => `<button class="link" data-module="${esc(name)}">${esc(name)}</button>`;

// ---- Theme-aware graph style ----------------------------------------------------
function css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function graphStyle() {
  const edgeStyles = {
    EXTENDS: { "line-style": "solid", "target-arrow-shape": "triangle", "target-arrow-fill": "hollow", color: css("--edge-strong") },
    IMPLEMENTS: { "line-style": "dashed", "target-arrow-shape": "triangle", "target-arrow-fill": "hollow", color: css("--edge-strong") },
    HAS: { "line-style": "solid", "target-arrow-shape": "vee", "source-arrow-shape": "diamond", color: css("--edge-strong") },
    USES: { "line-style": "dashed", "target-arrow-shape": "vee", color: css("--edge") },
    DEPENDS: { "line-style": "dotted", "target-arrow-shape": "vee", color: css("--edge") },
  };
  const style = [
    { selector: "node", style: {
      label: "data(label)", "text-wrap": "wrap", "text-valign": "center", "text-halign": "center",
      "font-size": 12, color: css("--text"), shape: "round-rectangle",
      width: "label", height: "label", padding: 10,
      "background-color": "data(fill)", "border-width": 1, "border-color": css("--border") } },
    { selector: "node[?key]", style: { "border-width": 2.5, "border-color": css("--accent"), "font-weight": 600 } },
    { selector: "node[kind = 'module']", style: { "font-size": 14, "font-weight": 600, padding: 14,
      "background-color": css("--surface") } },
    { selector: "node[kind = 'stub'], node[kind = 'more']", style: {
      "background-color": css("--stub"), "border-style": "dashed", color: css("--muted"), "font-size": 11 } },
    { selector: "node[kind = 'focus']", style: { "border-width": 3, "border-color": css("--accent") } },
    { selector: ":parent", style: {
      "background-color": css("--package-tint"), "background-opacity": Number(css("--package-opacity")), "border-style": "dashed",
      "border-color": css("--border"), "text-valign": "top", "text-halign": "center",
      "font-size": 12, color: css("--muted"), padding: 14 } },
    { selector: "edge", style: {
      width: 1.4, "curve-style": "bezier", "arrow-scale": 1.1,
      "line-color": css("--edge"), "target-arrow-color": css("--edge"), "source-arrow-color": css("--edge"),
      "target-arrow-shape": "vee", label: "data(label)", "font-size": 10, color: css("--muted"),
      "text-background-color": css("--bg"), "text-background-opacity": 0.85, "text-background-padding": 2 } },
    { selector: "edge[weight]", style: { width: "mapData(weight, 1, 120, 1.4, 6)" } },
    { selector: "edge[allowed = 0]", style: { "line-color": css("--danger"), "target-arrow-color": css("--danger"), width: 3 } },
    { selector: ".faded", style: { opacity: 0.15 } },
    { selector: ":selected", style: { "border-width": 3, "border-color": css("--accent") } },
  ];
  for (const [kind, s] of Object.entries(edgeStyles)) {
    style.push({ selector: `edge[relation = '${kind}']`, style: {
      "line-style": s["line-style"], "target-arrow-shape": s["target-arrow-shape"],
      "target-arrow-fill": s["target-arrow-fill"] || "filled", "source-arrow-shape": s["source-arrow-shape"] || "none",
      "line-color": s.color, "target-arrow-color": s.color, "source-arrow-color": s.color } });
  }
  return style;
}

// ---- Graph -------------------------------------------------------------------
if (window.cytoscapeElk) cytoscape.use(window.cytoscapeElk);
const cy = cytoscape({ container: document.getElementById("graph"), style: graphStyle(),
  wheelSensitivity: 0.3, minZoom: 0.1, maxZoom: 3, boxSelectionEnabled: false });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => cy.style(graphStyle()));

// Layers run down in the module views; a type view runs right, so that its many neighbours,
// which are wide and short, stack in columns.
function layout(direction) {
  const options = window.cytoscapeElk
    ? { name: "elk", nodeDimensionsIncludeLabels: true, fit: true, padding: 30, animate: false,
        elk: { algorithm: "layered", "elk.direction": direction, "elk.hierarchyHandling": "INCLUDE_CHILDREN",
               "elk.layered.spacing.nodeNodeBetweenLayers": 60, "elk.spacing.nodeNode": 30,
               "elk.edgeRouting": "POLYLINE" } }
    : { name: "breadthfirst", directed: true, fit: true, padding: 30 };
  const run = cy.layout(options);
  // A small diagram would fit at a large zoom; keep its text at a reading size.
  run.one("layoutstop", () => { if (cy.zoom() > 1.2) { cy.zoom(1.2); cy.center(); } });
  run.run();
}

const typeNode = (t, parent, kind = "type") => ({ data: {
  id: "t:" + t.name, label: t.simpleName || simpleName(t.name) + (t.role ? "\n«" + roleName(t.role) + "»" : ""),
  kind, type: t.name, key: t.key, fill: css(roleVar(t.role)), parent } });
const relationEdge = (r, labelled) => ({ data: {
  id: "r:" + r.from + ">" + r.to, source: "t:" + r.from, target: "t:" + r.to,
  relation: r.kind, label: labelled ? r.kind.toLowerCase() : "" } });

function moduleElements() {
  const nodes = MODEL.modules.map(m => {
    const types = typesOfModule(m.name);
    const keys = types.filter(t => t.key).length;
    return { data: { id: "m:" + m.name, kind: "module", module: m.name,
      label: `${m.name}\n${plural(types.length, "type")}${keys ? ", " + keys + " key" : ""}` } };
  });
  const edges = MODEL.moduleEdges
    .filter(e => !e.allowed || state.showImplied || !e.implied)
    .map(e => ({ data: { id: "e:" + e.from + ">" + e.to, source: "m:" + e.from, target: "m:" + e.to,
      weight: e.typePairs, allowed: e.allowed ? 1 : 0, label: String(e.typePairs) } }));
  return [...nodes, ...edges];
}

function moduleViewElements(moduleName) {
  const all = typesOfModule(moduleName);
  const curated = all.some(t => t.key);
  const showAll = state.allTypes || !curated;
  const shown = new Set();
  const elements = [];
  for (const p of packagesOfModule(moduleName)) {
    const types = typesOfPackage(p.name);
    const visible = showAll ? types : types.filter(t => t.key);
    elements.push({ data: { id: "p:" + p.name, label: relativePackage(p.name), kind: "package", package: p.name } });
    for (const t of visible) { elements.push(typeNode(t, "p:" + p.name)); shown.add(t.name); }
    const hidden = types.length - visible.length;
    if (hidden > 0) elements.push({ data: { id: "more:" + p.name, kind: "more", parent: "p:" + p.name,
      label: `+${hidden} more` } });
  }
  const stubs = new Map();
  for (const name of shown) {
    for (const r of [...(outgoing.get(name) || []), ...(incoming.get(name) || [])]) {
      if (!state.kinds.has(r.kind)) continue;
      const inside = shown.has(r.from) && shown.has(r.to);
      if (inside) { if (r.from === name) elements.push(relationEdge(r, false)); continue; }
      const other = typesByName.get(r.from === name ? r.to : r.from);
      const otherModule = moduleOf(other);
      if (otherModule === moduleName || (otherModule === LEAF && !state.showLeaf)) continue;
      const out = r.from === name;
      const key = (out ? name + ">" : "<" + name) + otherModule;
      const stub = stubs.get(key) || { name, otherModule, out, count: 0 };
      stub.count++; stubs.set(key, stub);
    }
  }
  const stubModules = new Set([...stubs.values()].map(s => s.otherModule));
  for (const m of stubModules) elements.push({ data: { id: "x:" + m, kind: "stub", module: m, label: m } });
  for (const [key, s] of stubs) {
    const [source, target] = s.out ? ["t:" + s.name, "x:" + s.otherModule] : ["x:" + s.otherModule, "t:" + s.name];
    elements.push({ data: { id: "s:" + key, source, target, label: String(s.count), relation: "DEPENDS" } });
  }
  return { elements, curated };
}

// A type view draws at most this many relations; the panel lists them all.
const MAX_DRAWN_RELATIONS = 30;

function typeViewElements(typeName) {
  const focus = typesByName.get(typeName);
  const other = r => typesByName.get(r.from === typeName ? r.to : r.from);
  const selected = [...(outgoing.get(typeName) || []), ...(incoming.get(typeName) || [])]
    .filter(r => state.kinds.has(r.kind))
    .sort((a, b) => kindOrder.indexOf(a.kind) - kindOrder.indexOf(b.kind) || other(b).key - other(a).key);
  const relations = selected.slice(0, MAX_DRAWN_RELATIONS);
  const names = new Set([typeName, ...relations.map(r => r.from), ...relations.map(r => r.to)]);
  const elements = [];
  const packages = new Set([...names].map(n => typesByName.get(n).packageName));
  for (const p of packages) elements.push({ data: { id: "p:" + p, label: relativePackage(p), kind: "package", package: p } });
  for (const n of names) {
    const t = typesByName.get(n);
    elements.push(typeNode(t, "p:" + t.packageName, n === typeName ? "focus" : "type"));
  }
  for (const r of relations) elements.push(relationEdge(r, true));
  return { elements, drawn: relations.length, selected: selected.length };
}

// ---- Panel ---------------------------------------------------------------------
const panel = document.getElementById("panel");
panel.addEventListener("click", e => {
  const t = e.target.closest("[data-type]"), m = e.target.closest("[data-module]");
  if (t) go("type", t.dataset.type);
  else if (m) go("module", m.dataset.module);
  else if (e.target.closest("[data-all-types]")) { state.allTypes = true; renderFilters(); render(); }
});

function legendHtml() {
  const roles = LEGEND.roles.map(r => `<tr><td><span class="swatch" style="background:var(${roleVar(r.name)})"></span>${esc(roleName(r.name))}</td><td>${esc(r.description)}</td></tr>`).join("");
  const kinds = LEGEND.relations.map(k => `<tr><td>${esc(k.label)}</td><td>${esc(k.description)}</td></tr>`).join("");
  return `<h3>Roles</h3><table class="legend">${roles}<tr><td><span class="swatch" style="background:var(--role-other)"></span>other</td><td>no <code>@ArchRole</code></td></tr></table>
    <h3>Relations</h3><table class="legend">${kinds}</table>
    <p class="meta">A thick blue border marks a <code>@Key</code> type. Click to select, double-click to open, Esc to zoom out.</p>`;
}

function showDefault(view) {
  const r = route();
  if (r.view === "modules") {
    const bad = MODEL.moduleEdges.filter(e => !e.allowed);
    panel.innerHTML = `<h2>Modules</h2><p>Each node is a top-level package. An arrow points to a module it depends on, and its number counts the type pairs.
      ${state.showImplied ? "" : "An arrow that a longer path implies is hidden; select a module to see all its dependencies."}</p>
      ${bad.length ? `<p class="bad">${bad.length} dependencies break the layering that ArchModule declares.</p>` : ""}
      ${legendHtml()}`;
  } else if (r.view === "module") {
    showModule(r.id, view);
  } else {
    showType(r.id);
  }
}

function showModule(name, view) {
  const m = modulesByName.get(name);
  const out = MODEL.moduleEdges.filter(e => e.from === name);
  const inc = MODEL.moduleEdges.filter(e => e.to === name);
  const types = typesOfModule(name);
  const adrs = [...new Set([...packagesOfModule(name).flatMap(p => p.adrs), ...types.flatMap(t => t.adrs)])].sort();
  const curated = types.some(t => t.key);
  panel.innerHTML = `<h2>${esc(name)}</h2><div class="meta"><code>${esc(m.packageName)}</code> · ${plural(types.length, "type")}</div>
    <p>${prose(m.summary)}</p>
    ${view && !curated ? `<div class="notice">No type of this module is marked <code>@Key</code> yet, so every type is shown.</div>` : ""}
    ${view && curated && !state.allTypes ? `<div class="notice">Showing key types. <button class="link" data-all-types>Show all ${types.length} types</button></div>` : ""}
    <h3>Depends on</h3><ul>${out.map(e => `<li>${moduleButton(e.to)} <span class="meta">${e.typePairs} pairs</span>${e.allowed ? "" : ' <span class="bad">not allowed</span>'}</li>`).join("") || "<li>none</li>"}</ul>
    <h3>Used by</h3><ul>${inc.map(e => `<li>${moduleButton(e.from)} <span class="meta">${e.typePairs} pairs</span></li>`).join("") || "<li>none</li>"}</ul>
    <h3>Packages</h3><ul>${packagesOfModule(name).map(p => `<li><code>${esc(relativePackage(p.name))}</code> ${prose(p.summary)}</li>`).join("")}</ul>
    ${adrs.length ? `<h3>Decisions</h3><ul>${decisionLinks(adrs)}</ul>` : ""}`;
}

function showType(name) {
  const t = typesByName.get(name);
  const group = (list, side) => kindOrder.map(kind => {
    const items = list.filter(r => r.kind === kind);
    return items.length ? `<li>${kind.toLowerCase()}: ${items.map(r => typeButton(r[side])).join(", ")}</li>` : "";
  }).join("");
  const out = outgoing.get(name) || [], inc = incoming.get(name) || [];
  panel.innerHTML = `<h2>${esc(simpleName(name))}</h2>
    <div class="meta">${esc(t.kind.toLowerCase())} · <span class="swatch" style="background:var(${roleVar(t.role)})"></span>${esc(roleName(t.role))}${t.key ? " · key" : ""}
      · ${moduleButton(moduleOf(t))} · <code>${esc(relativePackage(t.packageName))}</code></div>
    <p>${prose(t.summary) || '<span class="meta">No Javadoc.</span>'}</p>
    <p><a href="${esc(sourceLink(t))}" target="_blank" rel="noopener">Source on GitHub</a>${route().id === name ? "" : ` · <button class="link" data-type="${esc(name)}">Open</button>`}</p>
    ${t.adrs.length ? `<h3>Decisions</h3><ul>${decisionLinks(t.adrs)}</ul>` : ""}
    ${route().id === name && state.drawn < state.selected ? `<div class="notice">The diagram draws ${state.drawn} of the ${state.selected} relations that the filters select: the strongest kinds and key types first.</div>` : ""}
    <h3>Refers to (${out.length})</h3><ul>${group(out, "to") || "<li>none</li>"}</ul>
    <h3>Referred to by (${inc.length})</h3><ul>${group(inc, "from") || "<li>none</li>"}</ul>`;
}

// ---- Interaction --------------------------------------------------------------------
cy.on("tap", "node", e => {
  const d = e.target.data();
  if (d.type) showType(d.type);
  else if (d.module) showModule(d.module, false);
  else if (d.kind === "more") { state.allTypes = true; renderFilters(); render(); }
});
cy.on("tap", e => { if (e.target === cy) showDefault(true); });
cy.on("dbltap", "node", e => {
  const d = e.target.data();
  if (d.type) go("type", d.type); else if (d.module) go("module", d.module);
});
cy.on("mouseover", "node", e => {
  const hood = e.target.closedNeighborhood().union(e.target.ancestors()).union(e.target.descendants());
  hood.connectedNodes().ancestors().forEach(a => { hood.merge(a); });
  cy.elements().not(hood).not(hood.ancestors()).addClass("faded");
});
cy.on("mouseout", "node", () => cy.elements().removeClass("faded"));
document.addEventListener("keydown", e => {
  if (e.key !== "Escape" || e.target.tagName === "INPUT") return;
  const r = route();
  if (r.view === "type") go("module", moduleOf(typesByName.get(r.id)));
  else if (r.view === "module") go("modules");
});

// ---- Header ---------------------------------------------------------------------------
function renderCrumbs(r) {
  const parts = [r.view === "modules" ? `<span class="current">Modules</span>` : `<a href="#">Modules</a>`];
  if (r.view === "module") parts.push(`<span class="current">${esc(r.id)}</span>`);
  if (r.view === "type") {
    const m = moduleOf(typesByName.get(r.id));
    parts.push(`<a href="#module/${encodeURIComponent(m)}">${esc(m)}</a>`, `<span class="current">${esc(simpleName(r.id))}</span>`);
  }
  document.getElementById("crumbs").innerHTML = parts.join('<span class="sep">›</span>');
}

function renderFilters() {
  const kinds = LEGEND.relations.map(k =>
    `<label><input type="checkbox" data-kind="${k.name}" ${state.kinds.has(k.name) ? "checked" : ""}>${esc(k.label)}</label>`).join("");
  document.getElementById("filters").innerHTML = kinds +
    `<label><input type="checkbox" id="all-types" ${state.allTypes ? "checked" : ""}>all types</label>` +
    `<label title="arrows to ${esc(LEAF)} in a module view"><input type="checkbox" id="show-leaf" ${state.showLeaf ? "checked" : ""}>${esc(LEAF)}</label>` +
    `<label title="module arrows that a longer path implies"><input type="checkbox" id="show-implied" ${state.showImplied ? "checked" : ""}>implied</label>`;
}
document.getElementById("filters").addEventListener("change", e => {
  if (e.target.dataset.kind) {
    e.target.checked ? state.kinds.add(e.target.dataset.kind) : state.kinds.delete(e.target.dataset.kind);
  } else if (e.target.id === "all-types") state.allTypes = e.target.checked;
  else if (e.target.id === "show-leaf") state.showLeaf = e.target.checked;
  else if (e.target.id === "show-implied") state.showImplied = e.target.checked;
  render();
});

const search = document.getElementById("search");
const searchTargets = new Map();
for (const m of MODEL.modules) searchTargets.set(m.name + " (module)", ["module", m.name]);
for (const t of MODEL.types) searchTargets.set(simpleName(t.name) + " — " + relativePackage(t.packageName), ["type", t.name]);
document.getElementById("names").innerHTML = [...searchTargets.keys()].sort().map(k => `<option value="${esc(k)}">`).join("");
search.addEventListener("change", () => {
  const exact = searchTargets.get(search.value);
  const loose = exact || [...searchTargets.entries()].find(([k]) => k.toLowerCase().startsWith(search.value.toLowerCase()))?.[1];
  if (loose) { go(loose[0], loose[1]); search.value = ""; search.blur(); }
});

document.getElementById("commit").innerHTML =
  `<a href="${esc(MODEL.source.repository)}/commit/${esc(MODEL.source.commit)}" target="_blank" rel="noopener">${esc(MODEL.source.commit.slice(0, 7))}</a>`;

// ---- Render ------------------------------------------------------------------------------
function render() {
  const r = route();
  renderCrumbs(r);
  let elements;
  if (r.view === "modules") elements = moduleElements();
  else if (r.view === "module") elements = moduleViewElements(r.id).elements;
  else {
    const view = typeViewElements(r.id);
    elements = view.elements;
    state.drawn = view.drawn;
    state.selected = view.selected;
  }
  cy.elements().remove();
  cy.add(elements);
  layout(r.view === "type" ? "RIGHT" : "DOWN");
  showDefault(true);
  document.title = (r.view === "modules" ? "Modules" : r.view === "module" ? r.id : simpleName(r.id)) + " · FuzzTLA Architecture Atlas";
}
renderFilters();
render();
</script>
</body>
</html>
