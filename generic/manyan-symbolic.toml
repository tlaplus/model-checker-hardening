# Manyan's bounded mode, compared with Apalache as the generic checker (ADR 0033). Build it, then
# name this file at init:
#
#   make manyan-build
#   ./bin/fuzztla init --how=pbt --corpus corpus-manyan-symbolic --generic generic/manyan-symbolic.toml
#
# Manyan rejects most generated modules in this mode, as of v0.17.0 and still in v0.18.0: its
# type checker infers types from the rendered source, which annotates only variables and
# constants (ADR 0033, probe P4).
#
# init copies the executable into the corpus's tools/. The executable is relative to this file;
# keep its revision in step with MANYAN_REV in the Makefile.

[generic]
name = "Manyan"
compatibility = "apalache"
executable = "../target/checkers/manyan-5522fa6b11b9"
arguments = ["-symbolic", "-length", "{length}", "-config", "{config}", "{module}"]
